{% extends "base.html" %}

{% block title %}Sign Up - Cloud Resource & Job Scheduling System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
      <div class="glass-card p-4 p-sm-5 mt-4">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-info bg-opacity-10 text-info d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Create Account</h3>
          <p class="text-secondary small">Register to start submitting container workloads</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control" id="username" name="username" placeholder="developer" minlength="3" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control" id="email" name="email" placeholder="user@cloudscheduler.local" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-key"></i>
              </span>
              <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-shield-check"></i>
              </span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" minlength="6" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-2 mb-3">
            <i class="bi bi-check-circle me-2"></i> Register
          </button>
        </form>

        <div class="text-center text-secondary small">
          Already registered? 
          <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none fw-semibold">Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
